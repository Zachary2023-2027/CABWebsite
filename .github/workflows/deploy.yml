name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/kitchen-cabinet-builder-p2mi6a
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # The viewer is a Vite app. Everything else on the site is static.
      - name: Build the viewer
        working-directory: app
        run: |
          npm ci
          npm run build

      # Pages must already be switched on for the repo:
      # Settings -> Pages -> Source: "GitHub Actions".
      - uses: actions/configure-pages@v5

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r index.html assets js design docs .nojekyll _site/
          mkdir -p _site/app
          cp -r app/dist/* _site/app/
          ls -R _site | head -40

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
