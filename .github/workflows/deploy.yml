name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/kitchen-cabinet-builder-p2mi6a
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages must already be switched on for the repo:
      # Settings -> Pages -> Source: "GitHub Actions".
      # The workflow token is not permitted to enable it automatically.
      - uses: actions/configure-pages@v5

      # The site is static with no build step — publish the repo as-is.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
