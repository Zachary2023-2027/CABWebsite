<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Component Library</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<style>
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--font-sans); font-size: var(--fs-3); line-height: var(--lh-3);
  -webkit-font-smoothing: antialiased; }
h1, h2 { margin: 0; }

.topbar { position: sticky; top: 0; z-index: 30; min-height: var(--topbar-h);
  display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-2) var(--sp-6);
  flex-wrap: wrap;
  background: var(--surface); border-bottom: var(--bw) solid var(--border); }
.topbar h1 { font-size: var(--fs-3); font-weight: var(--fw-semibold); }
.topbar .ctx { color: var(--text-2); font-size: var(--fs-2); }
.topbar .right { margin-left: auto; display: flex; gap: var(--sp-2); flex-wrap: wrap; }

main { max-width: var(--max-content); margin: 0 auto; padding: var(--sp-6) var(--sp-6) var(--sp-20); }
section { margin-top: var(--sp-10); }
section:first-of-type { margin-top: var(--sp-4); }
.label { font-size: var(--fs-1); line-height: var(--lh-1); text-transform: uppercase;
  letter-spacing: var(--track-label); color: var(--text-2); font-weight: var(--fw-medium); }
section > h2 { font-size: var(--fs-4); line-height: var(--lh-4); font-weight: var(--fw-semibold); margin-top: var(--sp-1); }
.note { color: var(--text-2); font-size: var(--fs-2); line-height: var(--lh-2); margin: var(--sp-1) 0 0; max-width: 72ch; }

.cols { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-4); margin-top: var(--sp-4); }
@media (max-width: 980px) { .cols { grid-template-columns: 1fr; } }
/* min-width:0 for the same reason the fields need it: a grid item will not
   shrink below its content width without it, and the widest demo here is a
   340px side panel. */
.col { border: var(--bw) solid var(--border); border-radius: var(--r-2); padding: var(--sp-4); min-width: 0; }
.col > .label { display: block; margin-bottom: var(--sp-4); }
.demo { display: grid; gap: var(--sp-4); }
.demo-row { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; }
.demo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--sp-3); }
.caption { font-size: var(--fs-1); text-transform: uppercase; letter-spacing: var(--track-label); color: var(--text-2); }

ul.flags { margin: var(--sp-3) 0 0; padding-left: var(--sp-5); }
ul.flags li { font-size: var(--fs-2); line-height: var(--lh-3); color: var(--text-2); margin-bottom: var(--sp-2); }
ul.flags b { color: var(--text); font-weight: var(--fw-medium); }
.dialog--static { position: static; max-width: 100%; }
</style>
</head>
<body>

<header class="topbar">
  <h1>Component library</h1>
  <span class="ctx">Step 2. Every primitive, every state, both themes, both densities.</span>
  <div class="right">
    <div class="seg" role="group" aria-label="Density">
      <button type="button" class="seg__item" data-density-set="comfortable" aria-pressed="true">Comfortable</button>

    </div>

      <button type="button" class="seg__item" data-theme-set="system" aria-pressed="true">System</button>
      <button type="button" class="seg__item" data-theme-set="light" aria-pressed="false">Light</button>
      <button type="button" class="seg__item" data-theme-set="dark" aria-pressed="false">Dark</button>
    </div>
  </div>
</header>

<main id="board"></main>

<div class="dialog-scrim" hidden data-dialog="delete">

    <div class="dialog__foot">
      <button type="button" class="btn btn--secondary" data-dialog-close>Cancel</button>
      <button type="button" class="btn btn--danger" data-dialog-close>Delete cabinet</button>
    </div>
  </div>

<script type="module" src="components.js"></script>
<script type="module">
import { init } from './components.js';

const ico = (n, cls = '') => `<svg class="${cls}" aria-hidden="true"><use href="#i-${n}"></use></svg>`;

/* NumberInput is built from a helper rather than written out each time.
   Note the wrapper is a div, not a label. The control contains buttons, and
   clicking any part of a label activates its control, so a label wrapper
   makes the steppers focus the input instead of stepping it. The visible
   text is tied to the field with aria-label instead. */
const numField = (label, { value, unit = 'mm', step = 1, min, max, dp, state = '', hint = '' } = {}) => `
  <div class="field">
    <span class="field__label">${label}</span>
    <div class="input-shell num-input ${state}">
      <input class="num-input__input" type="text" inputmode="${dp ? 'decimal' : 'numeric'}"
             value="${value}" aria-label="${label}"
             data-step="${step}"${min !== undefined ? ` data-min="${min}"` : ''}${max !== undefined ? ` data-max="${max}"` : ''}${dp ? ` data-dp="${dp}"` : ''}
             ${state.includes('disabled') ? 'disabled' : ''}>
      <span class="num-input__unit">${unit}</span>
      <span class="num-input__steps">
        <button type="button" class="num-input__step" data-dir="up" aria-label="Increase ${label}">${ico('chev-up')}</button>
        <button type="button" class="num-input__step" data-dir="down" aria-label="Decrease ${label}">${ico('chev-down')}</button>
      </span>
    </div>
    ${hint}
  </div>`;

const board = document.getElementById('board');
board.innerHTML = DEMOS.map((d, i) => `
  <section>
    <span class="label">${String(i + 1).padStart(2, '0')}</span>
    <h2>${d.t}</h2>
    <p class="note">${d.n}</p>
    <div class="cols">
      <div class="col t-light" data-group-scope><span class="label">Light</span><div class="demo">${d.h}</div></div>
      <div class="col t-dark" data-group-scope><span class="label">Dark</span><div class="demo">${d.h}</div></div>
    </div>
  </section>`).join('') + `
  <section>
    <span class="label">${String(DEMOS.length + 1).padStart(2, '0')}</span>
    <h2>Density, side by side</h2>
    <p class="note">Comfortable on the planner, compact on the cut list. Only the row and control heights and the horizontal padding change. No type size changes, so nothing gets harder to read.</p>
    <div class="cols">
      <div class="col" data-density="comfortable"><span class="label">Comfortable</span>
        <div class="demo">
          <div class="demo-row"><button class="btn btn--primary">Add cabinet</button><button class="btn btn--secondary">Duplicate</button></div>
          <div class="table-wrap"><table class="table"><thead><tr><th>Part code</th><th class="n">Length</th><th class="n">Width</th></tr></thead>
            <tbody><tr><td class="code">B03-SIDE-L</td><td class="n">720</td><td class="n">560</td></tr>
            <tr><td class="code">B03-SIDE-R</td><td class="n">720</td><td class="n">560</td></tr>
            <tr><td class="code">B03-BOT</td><td class="n">568</td><td class="n">560</td></tr></tbody></table></div>
        </div>
      </div>
      <div class="col" data-density="compact"><span class="label">Compact</span>
        <div class="demo">
          <div class="demo-row"><button class="btn btn--primary">Add cabinet</button><button class="btn btn--secondary">Duplicate</button></div>
          <div class="table-wrap"><table class="table"><thead><tr><th>Part code</th><th class="n">Length</th><th class="n">Width</th></tr></thead>
            <tbody><tr><td class="code">B03-SIDE-L</td><td class="n">720</td><td class="n">560</td></tr>
            <tr><td class="code">B03-SIDE-R</td><td class="n">720</td><td class="n">560</td></tr>
            <tr><td class="code">B03-BOT</td><td class="n">568</td><td class="n">560</td></tr></tbody></table></div>
        </div>
      </div>

  <section>
    <span class="label">${String(DEMOS.length + 2).padStart(2, '0')}</span>
    <h2>Decisions and open questions</h2>
    <ul class="flags">
      <li><b>Number fields are text, not type=number.</b> The native spinner is what lets a value change when the pointer passes over it during a scroll. Removing the input type removes the problem at the source rather than patching it with a wheel handler. Arrow keys, shift and arrow for ten times the step, and the stepper buttons are all ours.</li>
      <li><b>Select stays native.</b> A custom listbox would match the drawing better, but it would cost the mobile picker and the type ahead people already know. The shell is styled, the element is not replaced.</li>
      <li><b>Camera presets are words.</b> Front, Left, Right, Top, Iso. No icon for Left reads as Left.</li>
      <li><b>Touch bumps controls only, not table rows.</b> Every tap target clears 44px on a coarse pointer, but the cut list stays dense on a tablet. The tick column gets its own 44px target instead of inflating the whole row.</li>
      <li><b>Two states are live only.</b> Hover and press cannot be shown statically. Put the pointer on the buttons and the toolbar to judge them.</li>
      <li><b>Guessed: the indeterminate checkbox.</b> Not in your brief. Added because a cabinet with some parts ticked off needs a third state, and the alternative is a progress number with no control.</li>
      <li><b>Not built yet: the cabinet family glyph set.</b> That belongs with the cabinet picker in Step 4, where the glyphs can be drawn against real cabinet types instead of invented in isolation.</li>
    </ul>
  </section>`;

document.querySelectorAll('[data-theme-set]').forEach((b) => b.addEventListener('click', () => {
  const v = b.dataset.themeSet;
  if (v === 'system') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = v;
  document.querySelectorAll('[data-theme-set]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
}));

document.querySelectorAll('[data-density-set]').forEach((b) => b.addEventListener('click', () => {
  document.documentElement.dataset.density = b.dataset.densitySet;
  document.querySelectorAll('[data-density-set]').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
}));

init();
</script>
